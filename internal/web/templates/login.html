{{template "head" .}}
{{template "bodyopen" .}}
{{template "top" .}}
<main class="wrap wrap-narrow">
	{{template "nav" .}}
	{{with .Body}}
		<h1>Acceder</h1>
		{{if .Problem}}<p class="notice" role="alert">{{.Problem}}</p>{{end}}
		<form class="stack" method="post" action="/login">
			<input type="hidden" name="next" value="{{.Next}}">
			<label for="user">Usuario</label>
			<input id="user" name="user" value="{{.User}}" autocomplete="username"
			       autocapitalize="off" spellcheck="false" autofocus required>
			<label for="password">Contraseña</label>
			<input id="password" name="password" type="password"
			       autocomplete="current-password" required>
			<div class="row">
				<button class="btn" type="submit">Entrar</button>
				<a class="btn btn-quiet" href="/">Cancelar</a>
			</div>
		</form>
		<p class="quiet">
			Leer la colección no necesita cuenta. Se pide para añadir o cambiar canciones.
		</p>
	{{end}}
</main>
{{template "scripts" .}}
</body>
</html>
