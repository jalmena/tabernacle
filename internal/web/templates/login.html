{{template "head" .}}
{{template "bodyopen" .}}
{{template "top" .}}
<main class="wrap wrap-narrow">
	{{with .Body}}
		<h1>{{$.T "login.title"}}</h1>
		{{if .Problem}}<p class="notice" role="alert">{{.Problem}}</p>{{end}}
		<form class="stack" method="post" action="/login">
			<input type="hidden" name="next" value="{{.Next}}">
			<label for="user">{{$.T "login.user"}}</label>
			<input id="user" name="user" value="{{.User}}" autocomplete="username"
			       autocapitalize="off" spellcheck="false" autofocus required>
			<label for="password">{{$.T "login.password"}}</label>
			<input id="password" name="password" type="password"
			       autocomplete="current-password" required>
			<div class="row">
				<button class="btn" type="submit">{{$.T "login.submit"}}</button>
				<a class="btn btn-quiet" href="/">{{$.T "login.cancel"}}</a>
			</div>
		</form>
		{{if .Registration}}
			<p class="quiet"><a href="/register">{{$.T "login.register"}}</a></p>
		{{end}}
	{{end}}
</main>
{{template "scripts" .}}
</body>
</html>
