{{template "head" .}}
<body>
{{template "top" .}}
<main class="wrap wrap-wide">
	{{template "nav" .}}
	<h1>Artistas</h1>
	{{if .Body}}
		<ul class="songlist">
			{{range .Body}}
				<li><a href="/?artist={{.Name}}">
					<span class="t">{{.Name}}</span>
					<span class="a">{{.Count}} {{plural .Count "canción" "canciones"}}</span>
				</a></li>
			{{end}}
		</ul>
	{{else}}
		<div class="empty"><p>Todavía no hay ningún artista en la colección.</p></div>
	{{end}}
</main>
</body>
</html>
