name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The race detector needs cgo, so it gets its own step rather than being
      # folded into the one above.
      - name: Test with the race detector
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/tabernacle

      # Short fuzzing on every push catches regressions in the parts that read
      # untrusted input, without turning CI into a fuzzing farm.
      - name: Fuzz briefly
        run: |
          go test ./internal/song   -run FuzzParse            -fuzz FuzzParse            -fuzztime 20s
          go test ./internal/songfs -run FuzzSanitizeSegment  -fuzz FuzzSanitizeSegment  -fuzztime 20s
          go test ./internal/voicing -run FuzzParseGrip       -fuzz FuzzParseGrip        -fuzztime 20s
          go test ./internal/voicing -run FuzzIdentify        -fuzz FuzzIdentify         -fuzztime 20s
          go test ./internal/voicing -run FuzzGenerate        -fuzz FuzzGenerate         -fuzztime 20s

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build --build-arg VERSION=ci -t tabernacle:ci .
      - name: Start it and check it answers
        run: |
          docker run -d --name tab -p 8080:8080 -v "$PWD/ci-data:/data" tabernacle:ci
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/healthz && break || sleep 0.5
          done
          curl -sf http://127.0.0.1:8080/healthz | tee /dev/stderr | grep -q '"status":"ok"'

          # The application must not run as root inside the container.
          #
          # Read the owner of /proc/1 rather than asking ps, which in busybox has
          # no -p and would fail. The assertion is positive, "= 1000" rather than
          # "!= root", so that a command which breaks fails the step: an empty
          # answer is not 1000, whereas it is also not "root".
          uid=$(docker exec tab stat -c '%u' /proc/1)
          echo "pid 1 runs as uid $uid"
          test "$uid" = "1000"
          docker rm -f tab

      # PUID/PGID is how a NAS or CasaOS install writes to a host bind mount owned
      # by root, which the entrypoint calls the commonest one-click-install
      # failure. It is the kind of path that only breaks on somebody else's box,
      # so it is exercised here rather than trusted.
      - name: Honour PUID and PGID
        run: |
          mkdir -p ci-data-puid
          docker run -d --name tabpuid -e PUID=1500 -e PGID=1500 -p 8081:8080 \
            -v "$PWD/ci-data-puid:/data" tabernacle:ci
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8081/healthz && break || sleep 0.5
          done
          # Answering at all means it opened its index inside /data, which is the
          # thing a wrong uid stops it doing.
          curl -sf http://127.0.0.1:8081/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          uid=$(docker exec tabpuid stat -c '%u' /proc/1)
          echo "pid 1 runs as uid $uid"
          test "$uid" = "1500"
          docker rm -f tabpuid
