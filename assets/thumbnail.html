<!-- Source of assets/thumbnail.png. Rendered at 1200x630 with the same
     engine that renders the application, so the store card and the page
     cannot end up in different typefaces:
       firefox --headless --screenshot thumbnail.png --window-size=1200,630 \
               file://$PWD/assets/thumbnail.html
-->
<meta charset="utf-8">
<style>
/* The header's declarations, copied from app.css — the same weight and the same
   tightening — but with the family named outright instead of system-ui.
   That difference is the whole point. On the page, system-ui is the reader's own
   desktop font, and that is right: the interface should look native. A store
   card is a fixed PNG, so it has to be one face, and whichever machine renders
   it must produce the same image. Headless Firefox has no desktop to ask and
   falls back to Noto Sans, which is not what a GNOME reader sees.
   Adwaita Sans is that reader's system-ui, and close enough to Segoe UI and to
   SF Pro that the card does not look like a different product anywhere.
   The glyph appears without the icon's rounded square — a dark box on a dark
   ground reads as a smudge, and the store shows the real icon beside this
   anyway. */
html, body { margin: 0; padding: 0 }
body {
  width: 1200px; height: 630px; background: #171614;
  display: flex; align-items: center; gap: 76px; padding: 0 96px;
  box-sizing: border-box;
  font-family: "Adwaita Sans", Inter, system-ui, "Segoe UI", Roboto, sans-serif;
  color: #e8e4dc;
}
svg { width: 250px; height: 250px; flex: 0 0 auto }
.brand { font-size: 96px; font-weight: 650; letter-spacing: -0.01em; line-height: 1 }
.brand span { color: #fdba74 }
.tag { margin-top: 20px; font-size: 34px; color: #a8a29a; white-space: nowrap }
.meta { margin-top: 18px; font-size: 25px; color: #78736b; white-space: nowrap }
</style>
